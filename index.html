<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>작은 TODO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#1c2430;font:16px/1.5 system-ui,sans-serif}main{width:min(100% - 24px,680px);margin:32px auto;padding:24px;background:#fff;border-radius:14px;box-shadow:0 4px 18px #17213218}h1{margin:0 0 4px;font-size:1.7rem}.notice{margin:0 0 22px;color:#586274;overflow-wrap:anywhere;word-break:break-word}form{display:flex;gap:8px;align-items:end}label{display:block;margin-bottom:5px;font-weight:650}.input-wrap{flex:1;min-width:0}input{width:100%;min-height:44px;padding:9px 11px;border:1px solid #9aa5b4;border-radius:8px;font:inherit}button{min-height:44px;padding:8px 13px;border:0;border-radius:8px;background:#175bd3;color:#fff;font:inherit;cursor:pointer}button:hover{background:#1049b0}button:focus-visible,input:focus-visible{outline:3px solid #f1b638;outline-offset:2px}#error{min-height:1.5em;margin:7px 0 0;color:#b42318;overflow-wrap:anywhere;word-break:break-word}.filters{display:flex;gap:7px;margin:22px 0 14px}.filters button{background:#e5eaf2;color:#273448}.filters button[aria-pressed="true"]{background:#175bd3;color:#fff}ul{padding:0;margin:0;list-style:none}li{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid #e4e8ee}li input{width:22px;min-height:22px;margin:2px 0 0;flex-shrink:0;accent-color:#175bd3}.todo-text{flex:1;min-width:0;padding-top:1px;overflow-wrap:anywhere;word-break:break-word}.completed .todo-text{color:#687386;text-decoration:line-through}.delete{flex-shrink:0;background:#fff;color:#a62222;border:1px solid #c74848}.delete:hover{background:#fff0f0}#empty{margin:18px 0;color:#586274;overflow-wrap:anywhere;word-break:break-word}#remaining{margin:16px 0 0;font-weight:650}@media(max-width:420px){main{width:calc(100% - 16px);margin:16px auto;padding:16px}form{align-items:stretch;flex-direction:column}form button{width:100%}}
</style></head><body><main>
<h1>작은 TODO</h1><p class="notice">목록은 서버 메모리에 저장됩니다. 서버를 다시 시작하면 목록이 초기화됩니다.</p>
<form id="todo-form"><div class="input-wrap"><label for="new-todo">할 일</label><input id="new-todo" name="text" autocomplete="off"></div><button type="submit">추가</button></form>
<p id="error" role="status" aria-live="polite"></p><div class="filters" aria-label="목록 필터"><button type="button" data-filter="all" aria-pressed="true">전체</button><button type="button" data-filter="active" aria-pressed="false">진행 중</button><button type="button" data-filter="completed" aria-pressed="false">완료</button></div><ul id="todos" aria-label="할 일 목록"></ul><p id="empty" hidden>표시할 할 일이 없습니다.</p><p id="remaining">남은 할 일 0개</p>
</main><script>
(()=>{const form=document.querySelector('#todo-form'),input=document.querySelector('#new-todo'),error=document.querySelector('#error'),list=document.querySelector('#todos'),empty=document.querySelector('#empty'),remaining=document.querySelector('#remaining'),filters=[...document.querySelectorAll('[data-filter]')];let todos=[],filter='all';const showError=m=>error.textContent=m;const visible=()=>todos.filter(t=>filter==='all'||(filter==='active'?!t.completed:t.completed));function render(){list.replaceChildren();for(const t of visible()){const item=document.createElement('li'),box=document.createElement('input'),text=document.createElement('span'),remove=document.createElement('button');item.className=t.completed?'completed':'';box.type='checkbox';box.checked=t.completed;box.setAttribute('aria-label','완료 상태 전환: '+t.text);box.addEventListener('change',()=>update(t.id,box.checked));text.className='todo-text';text.textContent=t.text;remove.type='button';remove.className='delete';remove.textContent='삭제';remove.setAttribute('aria-label','삭제: '+t.text);remove.addEventListener('click',()=>removeTodo(t.id));item.append(box,text,remove);list.append(item)}empty.hidden=visible().length!==0;remaining.textContent=`남은 할 일 ${todos.filter(t=>!t.completed).length}개`}async function load(){try{const r=await fetch('/api/todos');if(!r.ok)throw Error();todos=await r.json();render()}catch{showError('목록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.')}}async function update(id,completed){try{const r=await fetch(`/api/todos/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({completed})});if(!r.ok)throw Error();todos=await r.json();showError('');render()}catch{showError('변경하지 못했습니다. 목록을 다시 확인해 주세요.');await load()}}async function removeTodo(id){try{const r=await fetch(`/api/todos/${id}`,{method:'DELETE'});if(!r.ok)throw Error();showError('');await load()}catch{showError('삭제하지 못했습니다. 목록을 다시 확인해 주세요.');await load()}}form.addEventListener('submit',async e=>{e.preventDefault();const text=input.value.trim();if(text.length<1||[...text].length>200){showError('할 일은 공백을 제외하고 1~200자로 입력해 주세요.');return}try{const r=await fetch('/api/todos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});if(!r.ok)throw Error();await load();input.value='';showError('');input.focus()}catch{showError('추가하지 못했습니다. 잠시 후 다시 시도해 주세요.')}});filters.forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;filters.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));load()})();
</script></body></html>
