<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>할 일 목록</title>
<style>body{font-family:sans-serif;max-width:42rem;margin:3rem auto;padding:0 1rem}form{display:flex;gap:.5rem}input{flex:1;padding:.6rem}button{padding:.5rem}.todo{display:flex;gap:.7rem;align-items:center;padding:.6rem 0;border-bottom:1px solid #ddd}.todo span{flex:1}.done{text-decoration:line-through;color:#666}#error{color:#b00020;min-height:1.5em}</style></head>
<body><h1>할 일 목록</h1><form id="add-form"><input id="title" placeholder="할 일을 입력하세요" aria-label="할 일 제목"><button>추가</button></form>
<div id="filter-slot" aria-hidden="true"></div><ul id="todos"></ul><p id="error" role="alert"></p>
<script type="application/json" id="error-messages">
{"default":"요청을 처리할 수 없습니다. 잠시 후 다시 시도해 주세요.","codes":{"invalid_json":"요청 형식이 올바르지 않습니다.","title_blank":"할 일 제목을 입력해 주세요.","title_too_long":"할 일 제목은 200자까지 입력할 수 있습니다.","done_required":"완료 여부(done)를 true 또는 false로 보내 주세요.","not_found":"해당 할 일을 찾을 수 없습니다.","method_not_allowed":"허용되지 않은 요청 방식입니다."}}
</script><script>
const messages=JSON.parse(document.getElementById('error-messages').textContent),ERROR_MESSAGES=messages.codes,DEFAULT_ERROR_MESSAGE=messages.default;
const errorBox=document.getElementById('error'),list=document.getElementById('todos');
function clearError(){errorBox.textContent=''}
function showError(response){const msg=response&&response.error&&ERROR_MESSAGES[response.error.code];errorBox.textContent=msg||DEFAULT_ERROR_MESSAGE}
async function request(url,options){const r=await fetch(url,options);if(!r.ok){let data;try{data=await r.json()}catch{}showError(data);return null}clearError();return r.status===204?{}:r.json()}
async function refresh(){const data=await request('/api/todos');if(!data)return;list.replaceChildren();for(const todo of data.todos){const li=document.createElement('li');li.className='todo';const check=document.createElement('input');check.type='checkbox';check.checked=todo.done;check.setAttribute('aria-label','완료');check.onchange=async()=>{if(await request('/api/todos/'+todo.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:check.checked})}))refresh()};const title=document.createElement('span');title.textContent=todo.title;if(todo.done)title.className='done';const del=document.createElement('button');del.textContent='삭제';del.onclick=async()=>{if(await request('/api/todos/'+todo.id,{method:'DELETE'}))refresh()};li.append(check,title,del);list.append(li)}if(!data.todos.length){const li=document.createElement('li');li.textContent='할 일이 없습니다.';list.append(li)}}
document.getElementById('add-form').onsubmit=async e=>{e.preventDefault();const input=document.getElementById('title'),title=input.value.trim();if(!title){showError({error:{code:'title_blank'}});return}if(Array.from(title).length>200){showError({error:{code:'title_too_long'}});return}if(await request('/api/todos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})})){input.value='';refresh()}};
refresh();
</script></body></html>
