<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>할 일 목록</title><style>body{font:16px sans-serif;max-width:760px;margin:3rem auto;padding:0 1rem}form,.todo{display:flex;gap:.6rem;align-items:center;margin:1rem 0}input,button{font:inherit;padding:.5rem}.title{flex:1}.done{text-decoration:line-through;color:#666}#error{color:#a00;min-height:1.5em}.due{white-space:nowrap}</style></head>
<body><h1>할 일 목록</h1><form id="add"><label>할 일 <input id="title" placeholder="할 일을 입력하세요"></label><label>마감일(선택) <input id="new-due" type="date"></label><button>추가</button></form><fieldset id="filter"><legend>목록 보기</legend><label><input type="radio" name="filter" value="all" checked>전체</label><label><input type="radio" name="filter" value="active">진행 중</label><label><input type="radio" name="filter" value="done">완료</label></fieldset><div id="clear-completed-area"><button id="clear-completed" disabled>완료한 할 일 비우기</button></div><div id="todos"></div><p id="error" aria-live="polite"></p>
<script type="application/json" id="error-messages">{"default":"요청을 처리할 수 없습니다. 잠시 후 다시 시도해 주세요.","codes":{"invalid_json":"요청 형식이 올바르지 않습니다.","title_blank":"할 일 제목을 입력해 주세요.","title_too_long":"할 일 제목은 200자까지 입력할 수 있습니다.","done_required":"완료 여부(done)를 true 또는 false로 보내 주세요.","due_invalid":"마감일은 2026-03-01처럼 실제로 있는 날짜로 입력해 주세요.","nothing_to_update":"바꿀 내용을 보내 주세요. 완료 여부(done) 또는 마감일(due)이 필요합니다.","not_found":"해당 할 일을 찾을 수 없습니다.","method_not_allowed":"허용되지 않은 요청 방식입니다."}}</script>
<script type="application/json" id="confirm-messages">{"clear_completed":"완료한 할 일 {count}개를 지웁니다. 지운 항목은 되살릴 수 없습니다. 지우시겠습니까?"}</script>
<script type="application/json" id="filter-messages">{"empty":{"all":"할 일이 없습니다.","active":"진행 중인 할 일이 없습니다.","done":"완료한 할 일이 없습니다."}}</script>
<script>
const errorData=JSON.parse(document.getElementById('error-messages').textContent),confirmMessages=JSON.parse(document.getElementById('confirm-messages').textContent),filterMessages=JSON.parse(document.getElementById('filter-messages').textContent),ERROR_MESSAGES=errorData.codes,DEFAULT_ERROR_MESSAGE=errorData.default,errorBox=document.getElementById('error');
let allTodos=[],selectedFilter='all';
function clearError(){errorBox.textContent=''}
function showError(body){errorBox.textContent=body&&body.error&&ERROR_MESSAGES[body.error.code]||DEFAULT_ERROR_MESSAGE}
async function request(url,options){let r;try{r=await fetch(url,options)}catch{showError(null);throw Error('request')}let b=null;try{b=await r.json()}catch{}if(!r.ok){showError(b);throw Error('request')}clearError();return b}
function el(tag,attrs={},text=''){const n=document.createElement(tag);Object.assign(n,attrs);n.textContent=text;return n}
async function load(){try{const data=await request('/api/todos');allTodos=data.todos;render()}catch{}}
function render(todos=allTodos){allTodos=todos;const root=document.getElementById('todos'),clearButton=document.getElementById('clear-completed'),visible=allTodos.filter(t=>selectedFilter==='all'||(selectedFilter==='active'&&!t.done)||(selectedFilter==='done'&&t.done));root.replaceChildren();clearButton.disabled=!allTodos.some(t=>t.done);if(!visible.length){root.append(el('p',{},filterMessages.empty[selectedFilter]));return}for(const t of visible){const row=el('div',{className:'todo'}),check=el('input',{type:'checkbox'});check.checked=t.done;check.onchange=async()=>{try{await request('/api/todos/'+t.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:check.checked})});await load()}catch{}};const title=el('span',{className:'title'+(t.done?' done':'')},t.title),due=el('span',{className:'due'},t.due?'마감일: '+t.due:'마감일 없음'),date=el('input',{type:'date'});date.value=t.due||'';date.onchange=async()=>{try{await request('/api/todos/'+t.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({due:date.value})});await load()}catch{}};row.append(check,title,due,date);if(t.due){const clear=el('button',{},'마감일 지우기');clear.onclick=async()=>{try{await request('/api/todos/'+t.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({due:null})});await load()}catch{}};row.append(clear)}const del=el('button',{},'삭제');del.onclick=async()=>{try{await request('/api/todos/'+t.id,{method:'DELETE'});await load()}catch{}};row.append(del);root.append(row)}}
document.querySelectorAll('input[name="filter"]').forEach(input=>input.onchange=()=>{selectedFilter=input.value;render()});
document.getElementById('clear-completed').onclick=async()=>{const count=allTodos.filter(t=>t.done).length;if(!count||!window.confirm(confirmMessages.clear_completed.replace('{count}',count)))return;try{const result=await request('/api/todos/completed',{method:'DELETE'});render(result.todos)}catch{}};
document.getElementById('add').onsubmit=async e=>{e.preventDefault();const title=document.getElementById('title').value.trim();if(!title){showError({error:{code:'title_blank'}});return}if(Array.from(title).length>200){showError({error:{code:'title_too_long'}});return}const due=document.getElementById('new-due').value;try{await request('/api/todos',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(due?{title,due}:{title})});document.getElementById('title').value='';document.getElementById('new-due').value='';await load()}catch{}};
load();
</script></body></html>
